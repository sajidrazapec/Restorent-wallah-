function setTok(tok,rt,ex){CL.tok=tok;CL.rt=rt;CL.exp=Date.now()+Number(ex||3600)*1000;try{sessionStorage.setItem('sfc4_rt',rt);if(LS.get('keep',true))LS.set('rtl',rt)}catch(e){}}
async function cloudTok(){if(CL.tok&&Date.now()<CL.exp-60000)return CL.tok;if(!CL.rt)throw new Error('Not signed in to cloud');const k=LS.get('cloudAdm',{}).key||'';const j=await fx(AUTHB().sec+'/v1/token?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(CL.rt)});setTok(j.id_token,j.refresh_token,j.expires_in);return CL.tok}
async function cloudLogin(){const url=$('cl_url').value.trim().replace(/\/+$/,''),key=$('cl_key').value.trim(),em=$('cl_em').value.trim().toLowerCase(),pw=$('cl_pw').value;
if(!goodUrl(url))return toast('Database URL must look like https://xxxx.firebaseio.com');if(!key||!em||!pw)return toast('Fill in all fields');
try{const j=await fx(AUTHB().id+'/v1/accounts:signInWithPassword?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})});
CFG.s.dbUrl=url;LS.set('cloudAdm',{key,email:em});LS.set('keep',!!$('cl_keep').checked);setTok(j.idToken,j.refreshToken,j.expiresIn);CL.lastKey='';persist();startSync();renderAdmin();toast('Cloud connected ✓ — now publish your site file (Tools tab)')}catch(e){toast('Login failed: '+e.message)}}
function cloudLogout(){CL.tok='';CL.rt='';clearInterval(CL.int);try{sessionStorage.removeItem('sfc4_rt');localStorage.removeItem('sfc4_rtl')}catch(e){}renderAdmin()}
function cloudRemove(){cloudLogout();CFG.s.dbUrl='';persist();renderAdmin();toast('Cloud removed from this site')}
function normCfg(c){c.menu=(c.menu||[]).map(m=>Object.assign({vars:[]},m,{vars:m.vars||[]}));c.coupons=c.coupons||[];c.reviews=c.reviews||[];c.faq=c.faq||[];c.gallery=c.gallery||[];c.s=Object.assign({},DEF.s,c.s);return c}

async function cloudPush(){const c=JSON.parse(JSON.stringify(CFG));delete c.s.pinh;await dbq('PUT','config',c,true);CL.pushed=Date.now()}
async function cloudPull(){if(!cloudOn())return;try{const c=await dbq('GET','config');if(c&&c.s&&c.menu&&c.ver>CFG.ver){c.s.pinh=CFG.s.pinh;CFG=normCfg(c);applyBrand();if(location.hash!=='#admin'&&!$('modal').innerHTML&&document.activeElement.tagName!=='INPUT')renderShop()}}catch(e){}}
async function cloudSend(o){const b={id:o.id,ts:o.ts,name:o.name,phone:o.phone,type:o.type,table:o.table,addr:o.addr,note:o.note,pay:o.pay,when:o.when||'',lines:o.lines,sub:o.sub,disc:o.disc,coupon:o.coupon,gst:o.gst,fee:o.fee,total:o.total,status:'New',paid:false};const r=await dbq('POST','orders',b,false);o.key=r.name;LS.set('orders',orders)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.frequency.value=660},180);setTimeout(()=>{o.stop();a.close()},420)}catch(e){}}
function startSync(){clearInterval(CL.int);CL.first=true;CL.rFirst=true;pollOrders();pollReqs();CL.int=setInterval(()=>{pollOrders();pollReqs()},10000)}
async function pollOrders(){if(!CL.rt||!cloudOn())return;try{CL.n++;const full=CL.n%6===1||!CL.lastKey;const qs='orderBy='+encodeURIComponent('"$key"')+(full?'&limitToLast=60':'&startAt='+encodeURIComponent('"'+CL.lastKey+'"'));const r=await dbq('GET','orders',undefined,true,qs);CL.ok=true;let fresh=0,ch=false;
for(const[k,v]of Object.entries(r||{})){if(!v||!v.id)continue;if(k>CL.lastKey)CL.lastKey=k;const o=orders.find(x=>x.key===k);if(!o){orders.unshift(Object.assign({},v,{key:k,src:'web',lines:v.lines||[],paid:!!v.paid}));if(!CL.first)fresh++;ch=true}else if(o.status!==v.status||o.paid!==!!v.paid){o.status=v.status;o.paid=!!v.paid;ch=true}}
CL.first=false;if(ch){orders.sort((a,b)=>b.ts-a.ts);LS.set('orders',orders);if(isAdm()&&location.hash==='#admin'&&['orders','dash'].includes(A.tab)&&!$('modal').innerHTML)renderAdmin()}if(fresh){beep();toast('🔔 '+fresh+' new order'+(fresh>1?'s':''));document.title='🔔 ('+fresh+') New order!'}}catch(e){CL.ok=false}}
function cloudUpd(o,patch,coll='orders'){if(o.key&&CL.rt&&cloudOn())dbq('PATCH',coll+'/'+o.key,patch,true).catch(e=>toast('Cloud update failed: '+e.message))}
const rulesFor=em=>{const ow=`auth != null && auth.token.email === '${em}'`;return JSON.stringify({rules:{'.read':false,'.write':false,config:{'.read':true,'.write':ow},
orders:{'.read':ow,'$id':{'.read':true,'.write':`(${ow}) || (!data.exists() && newData.exists())`,'.validate':`newData.hasChildren(['id','ts','name','phone','lines','total','status']) && (auth != null || newData.child('status').val() === 'New')`}},
requests:{'.read':ow,'$id':{'.write':`(${ow}) || (!data.exists() && newData.exists())`,'.validate':`newData.hasChildren(['id','kind','ts','name','phone','status']) && (auth != null || newData.child('status').val() === 'Pending' || newData.child('status').val() === 'New') && (!newData.hasChild('msg') || newData.child('msg').val().length < 1000)`}}}},null,2)};

$('grid').innerHTML=list.map(x=>{const hv=x.vars&&x.vars.length,key=x.id+'|0',qn=cart[key]||0,pr=hv?Math.min(...x.vars.map(v=>v.p)):x.price;
const act=x.out?`<button disabled>${t('sold')}</button>`:hv?`<button class="pri" onclick="pickVar(${x.id})">${t('add')}</button>`:qn?`<div class="stp"><button onclick="chg('${key}',-1)">−</button><b>${qn}</b><button onclick="chg('${key}',1)">+</button></div>`:`<button class="pri" onclick="chg('${key}',1)">${t('add')}</button>`;

function renderBar(){const n=cartCount(),b=$('bar');if(!b)return;const c=$('cc');if(c)c.textContent=n;b.classList.toggle('hid',!n);if(n)b.innerHTML=`<div class="wrap row"><b>${n} item${n>1?'s':''} · ${money(calc(lines(),F.code,F.type).sub)}</b><div class="sp"></div><button class="pri" onclick="openCart()">${t('view')} →</button></div>`}
function chg(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];saveCart();if($('grid'))renderGrid();renderBar();if($('modal').querySelector('#cartBox'))openCart()}
function pickVar(id){const x=CFG.menu.find(m=>m.id===id);modal(`<h3 style="margin-top:0"><i class="vd ${x.veg?'v':'n'}"></i> ${esc(x.name)}</h3><p class="mu s13">${esc(x.desc)}</p>${x.vars.map((v,i)=>`<div class="line"><b>${esc(v.n)}</b><span>${money(v.p)}</span><button class="pri sm" onclick="chg('${x.id}|${i}',1);toast('Added ✓');closeModal()">${t('add')}</button></div>`).join('')}<button style="width:100%;margin-top:12px" onclick="closeModal()">✕</button>`)}

/* ---------- cart & checkout ---------- */
function types(){const s=CFG.s,a=[];if(s.delivery)a.push('Delivery');if(s.pickup)a.push('Pickup');if(s.dine)a.push('Dine-in');if(!a.length)a.push('Pickup');return a}
function pays(){const s=CFG.s,a=[];if(s.cod)a.push(['COD',F.type==='Delivery'?t('cod'):t('counter')]);if(s.upiOn&&s.upi)a.push(['UPI','UPI']);if(!a.length)a.push(['COD',t('counter')]);return a}
function openCart(){const L=lines(),tp=types();if(!tp.includes(F.type))F.type=tp[0];const pp=pays();if(!pp.some(p=>p[0]===F.pay))F.pay=pp[0][0];const c=calc(L,F.code,F.type),s=CFG.s;
modal(`<div id="cartBox"><div class="row"><h3 style="margin:0">🛒 ${t('cart')}</h3><div class="sp"></div>${L.length?`<button class="sm" onclick="cart={};saveCart();renderBar();if($('grid'))renderGrid();openCart()">${t('clear')}</button>`:''}<button class="sm" onclick="closeModal()">✕</button></div>
${L.map(l=>`<div class="line"><div><b>${esc(l.n)}</b>${l.v?` <span class="mu s13">(${esc(l.v)})</span>`:''}${l.it.out?` <span class="no" style="color:var(--no)">${t('sold')}</span>`:''}<div class="mu s12">${money(l.p)}</div></div><div class="stp"><button onclick="chg('${l.k}',-1)">−</button><b>${l.q}</b><button onclick="chg('${l.k}',1)">+</button></div><b>${money(l.p*l.q)}</b></div>`).join('')||`<p class="mu">${t('empty')}</p>`}
${L.length?`<div class="row" style="margin:12px 0"><input class="inp" style="flex:1;width:auto" placeholder="${t('coupon')}" value="${esc(F.code)}" oninput="F.code=this.value"><button onclick="applyCode()">${t('apply')}</button></div>
<div class="tot"><span>${t('sub')}</span><b>${money(c.sub)}</b></div>${c.disc?`<div class="tot" style="color:var(--ok)"><span>${t('disc')} (${esc(c.cp.code)})</span><b>−${money(c.disc)}</b></div>`:''}${s.gst?`<div class="tot mu"><span>${t('gst')} ${s.gst}% ${s.gstIncl?'(incl.)':''}</span><span>${money(c.gst)}</span></div>`:''}${F.type==='Delivery'?`<div class="tot"><span>${t('deliv')}</span><b>${c.fee?money(c.fee):t('free')}</b></div>`:''}${F.type==='Delivery'&&s.free>0&&c.sub<s.free?`<div class="mu s12">Add ${money(s.free-c.sub)} for free delivery</div>`:''}<div class="tot g"><span>${t('total')}</span><span>${money(c.total)}</span></div>
<h3>${t('checkout')}</h3><div class="fg"><div class="field"><label>${t('name')}</label><input value="${esc(F.name)}" oninput="F.name=this.value" autocomplete="name"></div><div class="field"><label>${t('phone')}</label><input inputmode="numeric" maxlength="10" value="${esc(F.phone)}" oninput="F.phone=this.value" autocomplete="tel"></div>
<div class="field"><label>${t('type')}</label><select onchange="F.type=this.value;openCart()">${tp.map(x=>`<option ${x===F.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>${t('pay')}</label><select onchange="F.pay=this.value">${pp.map(p=>`<option value="${p[0]}" ${p[0]===F.pay?'selected':''}>${esc(p[1])}</option>`).join('')}</select></div>
<div class="field"><label>Preferred time (optional)</label><input type="time" value="${esc(F.when)}" oninput="F.when=this.value"></div>${F.type==='Delivery'?`<div class="field f"><label>${t('addr')}</label><textarea rows="2" oninput="F.addr=this.value">${esc(F.addr)}</textarea></div>`:''}${F.type==='Dine-in'?`<div class="field"><label>${t('table')}</label><input inputmode="numeric" maxlength="3" value="${esc(F.table)}" oninput="F.table=this.value"></div>`:''}
<div class="field f"><label>${t('note')}</label><textarea rows="2" oninput="F.note=this.value">${esc(F.note)}</textarea></div></div>
${!isOpen()?`<div class="notice">${t('closedmsg')}</div>`:''}${s.min>0?`<div class="mu s12">Minimum order ${money(s.min)}</div>`:''}
<button class="pri" style="width:100%;margin-top:12px;padding:14px" onclick="placeOrder()">${t('place')} · ${money(c.total)}</button>`:''}</div>`)}
function applyCode(){const c=calc(lines(),F.code,F.type);if(!F.code)return;if(!c.cp)toast('Invalid coupon or minimum not met');else toast('Coupon applied ✓');openCart()}
function placeOrder(){const L=lines(),s=CFG.s;if(!L.length)return toast(t('empty'));if(!isOpen())return toast(t('closedmsg'));if(L.some(l=>l.it.out))return toast('Remove sold-out items first');
const ph=String(F.phone).replace(/\D/g,'').slice(-10);if(!F.name.trim())return toast(t('needname'));if(!/^[6-9]\d{9}$/.test(ph))return toast(t('needphone'));if(F.type==='Delivery'&&!F.addr.trim())return toast(t('needaddr'));if(F.type==='Dine-in'&&!String(F.table).trim())return toast(t('needtable'));
const c=calc(L,F.code,F.type);if(s.min>0&&c.sub<s.min)return toast('Minimum order is '+money(s.min));
const o={id:'SFC-'+Date.now().toString(36).toUpperCase().slice(-6),ts:Date.now(),name:F.name.trim(),phone:ph,type:F.type,table:F.type==='Dine-in'?String(F.table).trim():'',addr:F.type==='Delivery'?F.addr.trim():'',note:F.note.trim(),pay:F.pay,when:F.when||'',lines:L.map(l=>({n:l.n,v:l.v,p:l.p,q:l.q})),sub:c.sub,disc:c.disc,coupon:c.cp?c.cp.code:'',gst:c.gst,fee:c.fee,total:c.total,status:'New',paid:false,src:'web'};
orders.unshift(o);LS.set('orders',orders);LS.set('cust',{name:F.name.trim(),phone:ph,addr:F.addr});cart={};saveCart();F.code='';F.note='';renderBar();if($('grid'))renderGrid();success(o);if(cloudOn())cloudSend(o).then(()=>{const e=$('cs');if(e)e.innerHTML='✅ Order received by the restaurant. Track it in 🧾 My orders.'}).catch(()=>{const e=$('cs');if(e)e.innerHTML='⚠️ Could not reach the restaurant online — please send your order on WhatsApp below.'})}
function orderText(o){const s=CFG.s,L=o.lines.map(l=>`${l.q} x ${l.n}${l.v?' ('+l.v+')':''} - ${money(l.p*l.q)}`).join('\n');
return`*New order ${o.id}* - ${s.name}\n\nName: ${o.name}\nPhone: ${o.phone}\nType: ${o.type}${o.table?' (Table '+o.table+')':''}${o.addr?'\nAddress: '+o.addr:''}${o.when?'\nPreferred time: '+o.when:''}\n\n${L}\n\nSubtotal: ${money(o.sub)}${o.disc?'\nDiscount ('+o.coupon+'): -'+money(o.disc):''}${o.fee?'\nDelivery: '+money(o.fee):''}\n*Total: ${money(o.total)}*\nPayment: ${o.pay==='UPI'?'UPI':(o.type==='Delivery'?'Cash on delivery':'Pay at counter')}${o.note?'\nNote: '+o.note:''}`}
const waLink=o=>`https://wa.me/${waNum(CFG.s.wa)}?text=${encodeURIComponent(orderText(o))}`;
const upiLink=o=>`upi://pay?pa=${encodeURIComponent(CFG.s.upi)}&pn=${encodeURIComponent(CFG.s.name)}&am=${o.total}&cu=INR&tn=${encodeURIComponent(o.id)}`;
function success(o){const s=CFG.s;modal(`<div style="text-align:center"><div style="font-size:54px">🎉</div><h2 style="margin:6px 0">Order ${esc(o.id)} saved!</h2><p>Total <b>${money(o.total)}</b> · ${esc(o.type)}</p><p class="s13" id="cs">${cloudOn()?'Sending to the restaurant…':''}</p></div>
${s.wa?`<a href="${waLink(o)}" target="_blank" rel="noopener"><button class="pri" style="width:100%;padding:14px;background:#16a34a;border-color:#16a34a">💬 ${t('sent')}</button></a><p class="mu s12" style="text-align:center">Tap above to send your order to the restaurant — this confirms it.</p>`:`<div class="notice">The restaurant WhatsApp number is not set yet. Please call ${esc(s.phone||'the restaurant')} to confirm.</div>`}
${o.pay==='UPI'&&s.upi?`<a href="${upiLink(o)}"><button class="dk" style="width:100%;margin-top:8px;padding:13px">💳 ${t('payupi')} ${money(o.total)}</button></a><p class="mu s12" style="text-align:center">UPI ID: ${esc(s.upi)} · works on phones with a UPI app</p>`:''}
<button style="width:100%;margin-top:8px" onclick="closeModal()">${t('done')}</button>`)}
function openOrders(){modal(`<div class="row"><h3 style="margin:0">🧾 ${t('myorders')}</h3><div class="sp"></div><button class="sm" onclick="closeModal()">✕</button></div><div id="myo"></div><p class="mu s12">${cloudOn()?'Status updates live as the restaurant works on your order.':'Order updates are sent by the restaurant on WhatsApp/phone.'}</p>`);renderMyOrders();if(cloudOn())startTrack()}
function renderMyOrders(){const my=orders.filter(o=>o.src==='web').slice(0,20),el=$('myo');if(!el)return;
el.innerHTML=my.map(o=>{const st=['New','Accepted','Preparing','Ready',...(o.type==='Delivery'?['Out for delivery']:[]),'Delivered'],ix=st.indexOf(o.status);
return`<div class="ord"><div class="row"><b>${esc(o.id)}</b><span class="st" ${o.status==='Cancelled'?'style="background:#fee2e2;color:#991b1b"':''}>${esc(o.status)}</span><div class="sp"></div><b>${money(o.total)}</b></div><div class="mu s13">${fdate(o.ts)} · ${o.lines.map(l=>esc(l.n)+' ×'+l.q).join(', ')}</div>${o.key&&o.status!=='Cancelled'?`<div class="row" style="gap:4px;margin:8px 0">${st.map((x,i)=>`<span class="pill" style="background:${i<=ix?'#dcfce7;color:#166534':'var(--soft);color:var(--mu)'}">${x}</span>`).join('')}</div>`:''}<div class="row" style="margin-top:8px"><button class="sm" onclick="reorder('${o.id}')">↻ ${t('reorder')}</button>${CFG.s.wa?`<a href="${waLink(o)}" target="_blank" rel="noopener"><button class="sm">💬</button></a>`:''}</div></div>`}).join('')||'<p class="mu">No orders from this device yet.</p>'}
function startTrack(){clearInterval(trackT);const go=async()=>{let ch=false;for(const o of orders.filter(x=>x.src==='web'&&x.key&&!['Delivered','Cancelled'].includes(x.status)).slice(0,5)){try{const r=await dbq('GET','orders/'+o.key);if(r&&r.status&&(r.status!==o.status||!!r.paid!==!!o.paid)){o.status=r.status;o.paid=!!r.paid;ch=true}}catch(e){}}if(ch){LS.set('orders',orders);renderMyOrders()}};go();trackT=setInterval(go,10000)}
function reorder(id){const o=orders.find(x=>x.id===id);if(!o)return;o.lines.forEach(l=>{const it=CFG.menu.find(m=>m.name===l.n);if(!it)return;const vi=it.vars?Math.max(0,it.vars.findIndex(v=>v.n===l.v)):0;cart[it.id+'|'+vi]=(cart[it.id+'|'+vi]||0)+l.q});saveCart();renderBar();if($('grid'))renderGrid();openCart()}

function tDash(){const td=orders.filter(o=>dayKey(o.ts)===dayKey(Date.now())&&live(o)),rev=td.reduce((a,o)=>a+o.total,0),pend=orders.filter(o=>['New','Accepted','Preparing'].includes(o.status)).length;

const s=CFG.s,todo=[[s.wa,'Add your WhatsApp number (Settings) — orders are delivered there'],[s.upi,'Add your UPI ID to accept direct UPI payments'],[s.addr,'Add your address & phone'],[s.pinh!==hash('2468'),'Change the default admin PIN']].filter(x=>!x[0]);

function delOrderGo(id){const o=orders.find(x=>x.id===id);if(o&&o.key&&CL.rt&&cloudOn())dbq('DELETE','orders/'+o.key,undefined,true).catch(e=>toast('Cloud delete failed: '+e.message));orders=orders.filter(x=>x.id!==id);LS.set('orders',orders);closeModal();tOrders()}
function delOrder(id){modal(`<p>Delete order ${esc(id)}?</p><div class="row"><button class="dng" onclick="delOrderGo('${id}')">Delete</button><button onclick="closeModal()">Cancel</button></div>`)}
function csv(rows){const f=v=>{let x=String(v??'');if(/^[=+\-@]/.test(x))x="'"+x;return'"'+x.replaceAll('"','""')+'"'};return rows.map(r=>r.map(f).join(',')).join('\n')}
function exportOrders(){dl('orders.csv',csv([['Order ID','Date','Name','Phone','Type','Table','Address','Payment','Paid','Items','Subtotal','Discount','GST','Delivery','Total','Status'],...orders.map(o=>[o.id,new Date(o.ts).toISOString(),o.name,o.phone,o.type,o.table,o.addr,o.pay,o.paid?'Yes':'No',o.lines.map(i=>i.n+' x'+i.q).join('; '),o.sub,o.disc,o.gst,o.fee,o.total,o.status])]),'text/csv')}
function printBill(id){const o=orders.find(x=>x.id===id);if(!o)return;const s=CFG.s,w=window.open('','_blank','width=380,height=640');if(!w)return toast('Allow pop-ups to print');
w.document.write(`<html><head><title>${esc(o.id)}</title><style>body{font:13px monospace;width:300px;margin:8px auto}h2,p{text-align:center;margin:2px}table{width:100%}td:last-child{text-align:right}hr{border:0;border-top:1px dashed #000}</style></head><body><h2>${esc(s.name)}</h2><p>${esc(s.addr)}</p><p>${esc(s.phone)}</p>${s.gstin?`<p>GSTIN: ${esc(s.gstin)}</p>`:''}<hr><p>${esc(o.id)} · ${fdate(o.ts)}</p><p>${esc(o.type)}${o.table?' · Table '+esc(o.table):''} · ${esc(o.name)}</p><hr><table>${o.lines.map(l=>`<tr><td>${esc(l.n)}${l.v?' ('+esc(l.v)+')':''} x${l.q}</td><td>${l.p*l.q}</td></tr>`).join('')}</table><hr><table><tr><td>Subtotal</td><td>${o.sub}</td></tr>${o.disc?`<tr><td>Discount</td><td>-${o.disc}</td></tr>`:''}${s.gst?`<tr><td>GST ${s.gst}%${s.gstIncl?' (incl.)':''}</td><td>${o.gst}</td></tr>`:''}${o.fee?`<tr><td>Delivery</td><td>${o.fee}</td></tr>`:''}<tr><td><b>TOTAL</b></td><td><b>${o.total}</b></td></tr></table><hr><p>${o.paid?'PAID':'Payment: '+esc(o.pay)}</p><p>Thank you! Visit again.</p><script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}
/* POS */
function tPos(){const L=lines(A.pos),c=calc(L,'',A.posT);
$('at').innerHTML=`<div class="panel"><b>Quick bill (walk-in / phone orders)</b><div class="grid" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${CFG.menu.filter(m=>!m.out).flatMap(m=>m.vars&&m.vars.length?m.vars.map((v,i)=>({k:m.id+'|'+i,n:m.name+' ('+v.n+')',p:v.p})):[{k:m.id+'|0',n:m.name,p:m.price}]).map(x=>`<button onclick="posAdd('${x.k}',1)" style="text-align:left">${esc(x.n)}<br><span class="mu s12">${money(x.p)}</span>${A.pos[x.k]?` <b style="color:var(--brand)">×${A.pos[x.k]}</b>`:''}</button>`).join('')}</div></div>
<div class="panel">${L.map(l=>`<div class="line"><span>${esc(l.n)}${l.v?' ('+esc(l.v)+')':''}</span><div class="stp"><button class="sm" onclick="posAdd('${l.k}',-1)">−</button><b>${l.q}</b><button class="sm" onclick="posAdd('${l.k}',1)">+</button></div><b>${money(l.p*l.q)}</b></div>`).join('')||'<p class="mu">Tap items above to build a bill.</p>'}
<div class="fg" style="margin-top:10px"><div class="field"><label>Type</label><select onchange="A.posT=this.value;tPos()">${['Walk-in','Dine-in','Pickup','Delivery'].map(x=>`<option ${x===A.posT?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Payment</label><select onchange="A.posPay=this.value">${['Cash','UPI','Card'].map(x=>`<option ${x===A.posPay?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Customer (optional)</label><input value="${esc(A.posName)}" oninput="A.posName=this.value"></div><div class="field"><label>Table (optional)</label><input value="${esc(A.posTable)}" oninput="A.posTable=this.value"></div></div>
<div class="tot g"><span>Total</span><span>${money(c.total)}</span></div><button class="pri" style="width:100%;margin-top:8px" ${L.length?'':'disabled'} onclick="posSave()">Save & print bill</button></div>`}
function posAdd(k,d){A.pos[k]=(A.pos[k]||0)+d;if(A.pos[k]<=0)delete A.pos[k];tPos()}
function posSave(){const L=lines(A.pos);if(!L.length)return;const c=calc(L,'',A.posT);const o={id:'POS-'+Date.now().toString(36).toUpperCase().slice(-6),ts:Date.now(),name:A.posName.trim()||'Walk-in',phone:'',type:A.posT,table:A.posTable.trim(),addr:'',note:'',pay:A.posPay,lines:L.map(l=>({n:l.n,v:l.v,p:l.p,q:l.q})),sub:c.sub,disc:0,coupon:'',gst:c.gst,fee:c.fee,total:c.total,status:'Delivered',paid:true,src:'pos'};orders.unshift(o);LS.set('orders',orders);A.pos={};A.posName='';A.posTable='';tPos();printBill(o.id)}

function toggleOut(id){const m=CFG.menu.find(x=>x.id===id);m.out=!m.out;persist();tMenu()}
function delItem(id){modal(`<p>Delete this menu item?</p><div class="row"><button class="dng" onclick="CFG.menu=CFG.menu.filter(x=>x.id!==${id});persist();closeModal();tMenu()">Delete</button><button onclick="closeModal()">Cancel</button></div>`)}
let tmpImg='';
function editItem(id){const m=id?CFG.menu.find(x=>x.id===id):{name:'',cat:'',price:'',veg:true,emoji:'🍽️',desc:'',vars:[]};tmpImg=m.img||'';
modal(`<h3 style="margin-top:0">${id?'Edit':'Add'} item</h3><div class="fg"><div class="field"><label>Name</label><input id="i_n" value="${esc(m.name)}"></div><div class="field"><label>Category</label><input id="i_c" list="catl" value="${esc(m.cat)}"><datalist id="catl">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="field"><label>Price ₹ (base)</label><input id="i_p" type="number" min="0" value="${esc(m.price)}"></div><div class="field"><label>Emoji</label><input id="i_e" value="${esc(m.emoji)}"></div><div class="field f"><label>Description</label><input id="i_d" value="${esc(m.desc)}"></div>
<div class="field f"><label>Sizes / variants (optional, one per line: Name:Price)</label><textarea id="i_v" rows="3" placeholder="Half:119&#10;Full:189">${esc((m.vars||[]).map(v=>v.n+':'+v.p).join('\n'))}</textarea></div>
<div class="field"><label>Type</label><select id="i_t"><option value="1" ${m.veg?'selected':''}>Veg</option><option value="0" ${!m.veg?'selected':''}>Non-veg</option></select></div><div class="field"><label>Bestseller</label><select id="i_b"><option value="0">No</option><option value="1" ${m.best?'selected':''}>Yes ⭐</option></select></div>
<div class="field f"><label>Photo (optional — auto-compressed)</label><input type="file" accept="image/*" onchange="pickImg(this)"><span class="s12 mu" id="imgs">${tmpImg?'Photo set':'No photo (emoji shown)'}</span></div></div><div class="row" style="margin-top:12px"><button class="pri" onclick="saveItem(${id})">Save</button><button onclick="tmpImg='';document.getElementById('imgs').textContent='Photo removed'">Remove photo</button><button onclick="closeModal()">Cancel</button></div>`)}
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpImg=c.toDataURL('image/jpeg',.72);$('imgs').textContent='Photo ready ('+Math.round(tmpImg.length/1024)+' KB)'};im.src=r.result};r.readAsDataURL(f)}
function saveItem(id){const name=$('i_n').value.trim(),cat=$('i_c').value.trim(),price=Number($('i_p').value);const vars=$('i_v').value.split('\n').map(l=>l.trim().match(/^(.+?)\s*[:=]\s*(\d+(?:\.\d+)?)$/)).filter(Boolean).map(x=>({n:x[1].trim(),p:Number(x[2])}));
if(!name||!cat||(!vars.length&&!(price>=0&&$('i_p').value!=='')))return toast('Enter name, category and price');
const d={name,cat,price:vars.length?Math.min(...vars.map(v=>v.p)):price,emoji:$('i_e').value||'🍽️',desc:$('i_d').value.trim(),veg:$('i_t').value==='1',best:$('i_b').value==='1',vars,img:tmpImg};
if(id){Object.assign(CFG.menu.find(x=>x.id===id),d)}else CFG.menu.push(Object.assign({id:Date.now()},d));persist();closeModal();tMenu();toast('Saved ✓ — use Tools → Publish to update your live site')}

<div class="fg" style="margin-top:10px"><div class="field"><label>Code</label><input id="c_c" placeholder="DIWALI20"></div><div class="field"><label>Type</label><select id="c_t"><option value="pct">Percent %</option><option value="flat">Flat ₹</option></select></div><div class="field"><label>Value</label><input id="c_v" type="number" min="1"></div><div class="field"><label>Min order ₹</label><input id="c_m" type="number" min="0" value="0"></div></div><button class="pri" style="margin-top:8px" onclick="addCoupon()">Add coupon</button></div>

dl('index.html',h,'text/html');toast('Downloaded — upload it to your host')}
function backup(){dl('restaurant-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({cfg:CFG,orders}),'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!d.cfg.s||!Array.isArray(d.cfg.menu))throw 0;CFG=d.cfg;orders=Array.isArray(d.orders)?d.orders:[];persist();LS.set('orders',orders);renderAdmin();toast('Restored ✓')}catch(e){toast('Invalid backup file')}};r.readAsText(f)}
function resetAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('sfc4_')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.hash='';location.reload()}

/* ---------- Bookings, website content, polling for requests ---------- */
async function pollReqs(){if(!CL.rt||!cloudOn())return;try{CL.rn=(CL.rn||0)+1;const full=CL.rn%6===1||!CL.rKey;const qs='orderBy='+encodeURIComponent('"$key"')+(full?'&limitToLast=60':'&startAt='+encodeURIComponent('"'+CL.rKey+'"'));const r=await dbq('GET','requests',undefined,true,qs);let fresh=0,ch=false;
for(const[k,v]of Object.entries(r||{})){if(!v||!v.id)continue;if(k>(CL.rKey||''))CL.rKey=k;const o=reqs.find(x=>x.key===k);if(!o){reqs.unshift(Object.assign({},v,{key:k}));if(!CL.rFirst)fresh++;ch=true}else if(o.status!==v.status){o.status=v.status;ch=true}}
CL.rFirst=false;if(ch){reqs.sort((a,b)=>b.ts-a.ts);LS.set('reqs',reqs);if(isAdm()&&location.hash==='#admin'&&['reqs','dash'].includes(A.tab)&&!$('modal').innerHTML)renderAdmin()}if(fresh){beep();toast('🔔 '+fresh+' new booking/message')}}catch(e){}}
const RS=['Pending','Confirmed','Cancelled','Completed'],ES=['New','Replied','Closed'];
function tReqs(){const l=reqs.filter(r=>A.rf==='All'||r.kind===A.rf);
$('at').innerHTML=`<div class="row"><select class="inp" style="width:auto" onchange="A.rf=this.value;tReqs()">${['All','Reservation','Enquiry'].map(x=>`<option ${x===A.rf?'selected':''}>${x}</option>`).join('')}</select><span class="mu s12">${l.length} item(s)</span></div>
${l.map(r=>`<div class="ord"><div class="row"><b>${esc(r.id)}</b><span class="st">${esc(r.status)}</span><span class="pill" style="background:var(--soft)">${esc(r.kind)}</span><div class="sp"></div><span class="s12 mu">${fdate(r.ts)}</span></div><div class="s13">${esc(r.name)} · ${esc(r.phone)}</div>${r.kind==='Reservation'?`<p>📅 ${esc(r.date)} · ⏰ ${esc(r.time)} · 👥 ${esc(r.guests)}${r.note?'<br><span class="mu s13">'+esc(r.note)+'</span>':''}</p>`:`<p><b>${esc(r.topic)}:</b> ${esc(r.msg)}</p>`}
<div class="row"><select onchange="reqStatus('${r.id}',this.value)">${(r.kind==='Reservation'?RS:ES).map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select><a target="_blank" rel="noopener" href="https://wa.me/91${esc(r.phone)}?text=${encodeURIComponent(r.kind==='Reservation'?`Hi ${r.name}, your table booking ${r.id} for ${r.date} at ${r.time} (${r.guests} guests) at ${CFG.s.name} is ${r.status}.`:`Hi ${r.name}, thanks for contacting ${CFG.s.name}. `)}"><button class="sm">💬 Reply</button></a><button class="sm dng" onclick="delReq('${r.id}')">Delete</button></div></div>`).join('')||'<p class="mu">No bookings or messages yet.</p>'}`}
function reqStatus(id,st){const r=reqs.find(x=>x.id===id);if(r){r.status=st;LS.set('reqs',reqs);cloudUpd(r,{status:st},'requests');tReqs()}}
function delReq(id){modal(`<p>Delete ${esc(id)}?</p><div class="row"><button class="dng" onclick="delReqGo('${id}')">Delete</button><button onclick="closeModal()">Cancel</button></div>`)}
function delReqGo(id){const r=reqs.find(x=>x.id===id);if(r&&r.key&&CL.rt&&cloudOn())dbq('DELETE','requests/'+r.key,undefined,true).catch(e=>toast('Cloud delete failed: '+e.message));reqs=reqs.filter(x=>x.id!==id);LS.set('reqs',reqs);closeModal();tReqs()}
function compressImg(f,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)})}
function tSite(){const s=CFG.s,kb=Math.round(CFG.gallery.reduce((a,g)=>a+g.src.length,0)/1024);
$('at').innerHTML=`<div class="panel"><b>About & highlights</b><div class="fg" style="margin-top:10px"><div class="field f"><label>Our story</label><textarea id="w_story" rows="5">${esc(s.story)}</textarea></div><div class="field f"><label>Highlights (one per line)</label><textarea id="w_usp" rows="4">${esc(s.usp)}</textarea></div></div></div>
<div class="panel"><b>Hours, bookings & links</b><div class="fg" style="margin-top:10px">${sel('offDay','Weekly off day',s.offDay,[['','None'],...DAYS.map((d,i)=>[i,d])])}${sel('res','Table reservations',s.res?1:0,YN)}${sel('maps','Show map',s.maps?1:0,YN)}${fld('insta','Instagram URL',s.insta,'url','placeholder="https://instagram.com/…"')}${fld('fb','Facebook URL',s.fb,'url')}${fld('yt','YouTube URL',s.yt,'url')}</div></div>
<div class="panel"><b>Legal pages</b><p class="mu s12">Sample text — review it and adapt it to your business (it is not legal advice). Use {name} for your restaurant name.</p><div class="fg"><div class="field f"><label>Privacy policy</label><textarea id="w_priv" rows="6">${esc(s.privacy)}</textarea></div><div class="field f"><label>Terms & refund policy</label><textarea id="w_terms" rows="6">${esc(s.terms)}</textarea></div></div></div>
<button class="pri" style="width:100%;padding:13px" onclick="saveSite()">Save website content</button>
<div class="panel"><b>FAQ</b>${CFG.faq.map((f,i)=>`<div class="line"><span><b>${esc(f.q)}</b><br><span class="mu s13">${esc(f.a)}</span></span><button class="sm dng" onclick="CFG.faq.splice(${i},1);persist();tSite()">✕</button></div>`).join('')||'<p class="mu">No FAQ</p>'}<div class="fg" style="margin-top:10px"><div class="field f"><label>Question</label><input id="f_q"></div><div class="field f"><label>Answer</label><textarea id="f_a" rows="2"></textarea></div></div><button class="pri" style="margin-top:8px" onclick="addFaq()">Add FAQ</button></div>
<div class="panel"><b>Photo gallery</b> <span class="mu s12">(${CFG.gallery.length} photos · ~${kb} KB)</span>${kb>1500?'<div class="notice">Large gallery — it slows the site and fills browser storage. Keep to ~10 small photos.</div>':''}<div class="gal" style="margin:10px 0">${CFG.gallery.map((g,i)=>`<div><img src="${esc(g.src)}" alt=""><button class="sm dng" style="width:100%" onclick="CFG.gallery.splice(${i},1);persist();tSite()">Remove</button></div>`).join('')}</div><input type="file" accept="image/*" multiple onchange="addPhotos(this)"><div class="row" style="margin-top:8px"><input id="g_u" class="inp" style="flex:1;width:auto" placeholder="…or paste an https:// image link"><button onclick="addGalUrl()">Add link</button></div></div>`}
function saveSite(){const g=id=>$('s_'+id).value,s=CFG.s;const urls={insta:g('insta').trim(),fb:g('fb').trim(),yt:g('yt').trim()};for(const k in urls)if(urls[k]&&!safeUrl(urls[k]))return toast('Links must start with https://');
Object.assign(s,urls,{story:$('w_story').value.trim(),usp:$('w_usp').value.trim(),offDay:g('offDay')===''?'':Number(g('offDay')),res:g('res')==='1',maps:g('maps')==='1',privacy:$('w_priv').value,terms:$('w_terms').value});persist();renderAdmin();toast('Website content saved ✓')}
function addFaq(){const q=$('f_q').value.trim(),a=$('f_a').value.trim();if(!q||!a)return toast('Enter question and answer');CFG.faq.push({q,a});persist();tSite()}
async function addPhotos(inp){const fs=[...inp.files].slice(0,10);if(!fs.length)return;toast('Adding photos…');for(const f of fs){try{CFG.gallery.push({src:await compressImg(f,800,.7),cap:''})}catch(e){}}persist();tSite()}
function addGalUrl(){const u=safeUrl($('g_u').value);if(!u)return toast('Paste an https:// image link');CFG.gallery.push({src:u,cap:''});persist();tSite()}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
setTheme();applyBrand();route();cloudPull();
</script></body></html>
